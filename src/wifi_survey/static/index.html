<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <title>WiFi Survey</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">WiFi Survey</div>
    <nav id="tabs" aria-label="Ansichten"></nav>
    <div id="savestate" class="savestate" title="Speicherstand"></div>
    <div id="theme-picker" class="theme-picker">
      <button id="theme-btn" type="button" class="theme-btn" aria-haspopup="true" aria-expanded="false" title="Darstellung"></button>
      <div id="theme-menu" class="theme-menu" role="menu" hidden></div>
    </div>
  </header>
  <main id="layout">
    <aside id="panel" aria-label="Werkzeuge und Eigenschaften"></aside>
    <section id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="Zeichenfläche"></svg>
      <div id="hint" class="hint" hidden></div>
    </section>
  </main>
  <footer id="statusbar">
    <span id="status-pos"></span>
    <span id="status-zoom"></span>
    <span id="status-info"></span>
  </footer>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
