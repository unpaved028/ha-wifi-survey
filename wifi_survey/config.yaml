# WiFi Survey – Home Assistant app (https://contributors.home-assistant.io/apps/reference/configuration/)
name: WiFi Survey
version: "1.6.0"
slug: wifi_survey
description: Upload floor plans, detect walls automatically and place your devices – WiFi coverage maps, simulation, recommendations and a device finder
url: https://github.com/unpaved028/ha-wifi-survey
image: ghcr.io/unpaved028/wifi-survey
stage: experimental
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:wifi-marker
panel_title: WiFi Survey
homeassistant_api: true
hassio_api: true
# Direktzugriff ohne Anmeldung, nur für die Android-App zum Messen; standardmäßig aus
ports:
  8099/tcp: null
options:
  fritzbox_host: fritz.box
  fritzbox_user: ""
  fritzbox_password: ""
schema:
  fritzbox_host: str
  fritzbox_user: str
  fritzbox_password: password
