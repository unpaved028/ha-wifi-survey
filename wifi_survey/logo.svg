  <!-- Symbol links: Grundriss mit Funksignal -->
  <g transform="translate(15 14) scale(0.5625)">
    <rect x="20" y="20" width="40" height="48" fill="#18bcf2" fill-opacity="0.36"/>
    <rect x="20" y="20" width="88" height="88" rx="7" fill="none" stroke="#ffffff" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 60 20 V 42 M 60 90 V 108 M 20 68 H 39" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="square"/>
    <path d="M 54 84 A 32 32 0 0 1 86 52" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M 68 84 A 18 18 0 0 1 86 66" fill="none" stroke="#ffd479" stroke-width="8" stroke-linecap="round"/>
    <circle cx="86" cy="84" r="8.5" fill="#ffd479"/>
  </g>
  <!-- Sprachneutraler Schriftzug rechts -->
  <text x="96" y="49" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.2">WiFi Survey</text>
  <rect x="97" y="61" width="48" height="3.5" rx="1.75" fill="#38bdf8"/>
</svg>
