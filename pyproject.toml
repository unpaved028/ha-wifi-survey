[project]
name = "wifi-survey"
version = "1.6.0"
description = "WLAN-Ausleuchtung für FRITZ!Box-Mesh mit Repeatern"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "opencv-contrib-python-headless>=5.0.0.93",
    "python-multipart>=0.0.32",
    "uvicorn>=0.30",
]

[project.scripts]
wifi-survey = "wifi_survey:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "websockets>=17.4",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-Parameter wie File(...) sind feste Vorgaben, kein veränderlicher Standardwert
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Depends"]
